workflows:
  android-build:
    name: Urlaubskasse Android
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Android-Projekt erzeugen
        script: |
          flutter create --platforms=android --project-name urlaubskasse --org com.urlaub _scaffold
          cp -r _scaffold/android .
          rm -rf _scaffold
      - name: Internet-Berechtigung sicherstellen
        script: |
          perl -0pi -e 's{<application}{<uses-permission android:name="android.permission.INTERNET"/>\n    <application}' android/app/src/main/AndroidManifest.xml
      - name: Pakete holen
        script: |
          flutter pub get
      - name: APK bauen
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
